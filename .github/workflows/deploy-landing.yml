name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - apps/landing/**
      - .github/workflows/deploy-landing.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install landing page dependencies
        run: pnpm --filter @studycall/landing... install --frozen-lockfile
      - name: Check landing page
        run: pnpm --filter @studycall/landing type-check
      - name: Build landing page
        run: pnpm build:landing
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
      - name: Upload landing page
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/landing/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
