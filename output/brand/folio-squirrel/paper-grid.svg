  <title id="construction-paper-title">Studycall — Folio / Paper squirrel</title>
  <desc id="construction-paper-desc">A clay-rose squirrel in profile, built on a six-unit grid. Its broad curled tail and compact body have soft paper facets, with one folded ear, one slanted eye, and a single swept foot.</desc>
