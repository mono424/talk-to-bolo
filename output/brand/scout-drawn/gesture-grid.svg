  <title id="construction-gesture-title">Studycall — Scout / Gesture</title>
  <desc id="construction-gesture-desc">Scout redrawn as two loose, tapered ink gestures: a curious profile and a short swept crest. A single irregular eye is carved out of the body.</desc>
