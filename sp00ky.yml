# yaml-language-server: $schema=https://sp00ky.cloud/schema/sp00ky.schema.json
#
# Studycall on Sp00ky Cloud's free plan (platform: Cloudflare):
#   - the SSP sync node runs as a Cloudflare Durable Object,
#   - the web app is published as a static SPA on Workers Static Assets,
#   - SurrealDB is the shared free database (namespace `talktobolo`), reached
#     by all three. For your own SurrealDB Cloud instance instead, use
#     `hosting: external` with `endpoint`, `username` and `password`.
#   - the API (apps/api: voice calls, PDF processing, search, MCP) is a sp00ky
#     Worker backend: `spky deploy` bundles it and the sync node runs it as a
#     Dynamic Worker. See docs/setup.md.
mode: singlenode
slug: talktobolo
# Staging control plane (the only one provisioned).
cloudApi: https://api-stg.sp00ky.cloud
surrealdb:
  # The shared free database: the project always gets the namespace named
  # after its slug, database `main`; `spky deploy` bakes the endpoint into
  # the web app.
  hosting: cloud
  namespace: talktobolo
  database: main
schema: ./schema
buckets:
  - ./schema/buckets/materials.surql
# The bucket uses a file backend (file:/buckets/materials). Without sizeGB no
# volume is mounted at /buckets and uploaded PDFs and page images land on
# ephemeral storage. sizeGB is the provisioned disk, not a quota.
deployment:
  storage:
    sizeGB: 5
version:
  cloud: canary
logLevel:
  dev: info
  cloud: info
clientTypes:
  - format: typescript
    output: ./apps/web/src/schema.gen.ts
apps:
  web:
    type: frontend
    dev:
      type: npm
      script: dev
      workdir: ./apps/web
    deploy:
      # Required by config validation, unused on the free plan: the SPA is
      # built with `static.build` and published as static assets.
      dockerfile: ./apps/web/Dockerfile
      context: .
      port: 80
      static:
        build: pnpm --filter @studycall/web build
        dir: apps/web/dist
  # The API (apps/api, a Hono app). Like any sp00ky backend it runs jobs: the
  # web app writes a row to the `job` outbox and the sync node calls the path
  # in openapi.yml with its payload. On Cloudflare it is a Worker backend:
  # `spky deploy` bundles `worker.entry` and the sync node loads it as a
  # Dynamic Worker. Local development (dev/sp00ky.yml) runs it under
  # `wrangler dev` with apps/api/wrangler.jsonc.
  api:
    type: backend
    spec: ./apps/api/openapi.yml
    method:
      type: outbox
      table: job
      schema: ./schema/src/outbox/api.surql
      # A call recap takes Claude a while; indexing and progress jobs should
      # not queue behind it.
      concurrency: 4
    deploy:
      # Job requests time out after 10 s by default; a call recap takes longer.
      # Kept under the ~70 s after which an idle sync node Durable Object may
      # be evicted mid-call (a cut-off job is retried).
      timeout: 60
    auth:
      type: token
      # The job runner sends it on every job and the API checks it (JOB_TOKEN
      # below). Not a secret: job paths are never public, `expose` is.
      token: &jobToken 8aa90389bd84c6dc0cd7237d680f293d
    worker:
      entry: ./apps/api/src/index.ts
      compatibilityDate: "2026-10-15"
      compatibilityFlags: [nodejs_compat]
      # server-schema.surql is imported as a string.
      textModules: ["**/*.surql"]
      # PDF parsing and image extraction need more than the default 30 s of
      # CPU per Workflow step.
      cpuMs: 300000
      # Embeddings for the lecture search index.
      ai: AI
      # PDF/markdown processing: one durable Workflow run per material.
      workflows:
        - binding: INGEST
          class: IngestMaterial
      # Routes served publicly on talktobolo.stg.spky.cloud. Everything else,
      # the job paths included, is reachable only through jobs.
      expose:
        # Starting a call: the browser needs the voice token back at once.
        - /api/calls
        # Course search: results shown as the student types.
        - /api/courses/*
        # PDF upload (the file is the request body) and the viewer's download.
        - /api/materials/*
        # The consent page of an AI client connection, and its redirect.
        - /api/oauth/*
        # OAuth for AI clients: discovery, registration, authorize, token.
        - /oauth/*
        - /.well-known/oauth*
        # The MCP server AI clients call.
        - /mcp
        # ElevenLabs' Custom LLM endpoint; replies stream.
        - /llm/*
        # Images inside lectures: <img> cannot send the session token.
        - /material-assets/*
    env:
      - vault:
          - ANTHROPIC_API_KEY
          - ELEVENLABS_API_KEY
          - ELEVENLABS_AGENT_ID
          - LLM_SHARED_SECRET
          - AGENT_MEMORY_URL
          - AGENT_MEMORY_API_KEY
          # The namespace login of the shared free database (user `owner`,
          # `spky project credentials`).
          - SURREAL_PASS
      - APP_ORIGIN: https://talktobolo.stg.spky.cloud
        API_ORIGIN: https://talktobolo.stg.spky.cloud
        SURREAL_URL: https://surreal-free.stg.spky.cloud
        SURREAL_NS: talktobolo
        SURREAL_DB: main
        SURREAL_USER: owner
        SURREAL_AUTH_NS: talktobolo
        CLAUDE_MODEL: claude-opus-5-5
        CLAUDE_PDF_MODEL: claude-opus-5-5
        EMBEDDING_MODEL: "@cf/qwen/qwen3-embedding-0.6b"
        JOB_TOKEN: *jobToken
