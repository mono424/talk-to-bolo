# yaml-language-server: $schema=https://sp00ky.cloud/schema/sp00ky.schema.json
#
# Studycall on Sp00ky Cloud's free plan (platform: Cloudflare):
#   - the SSP sync node runs as a Cloudflare Worker,
#   - the web app is published as a static SPA on Workers Static Assets,
#   - SurrealDB is external (SurrealDB Cloud), reached by both.
# The free plan runs no backends, so the API (apps/api: voice calls, PDF
# processing, search, MCP) is our own Cloudflare Worker, deployed with
# wrangler. See README.md.
mode: singlenode
slug: studycall
surrealdb:
  hosting: external
  # Your SurrealDB Cloud instance (Surrealist > Connect). The web app connects
  # to it directly, the SSP Worker over HTTP.
  endpoint: wss://YOUR-INSTANCE.aws-euw1.surreal.cloud
  namespace: studycall
  database: main
  username: studycall
  password:
    vault: DB_PASSWORD
schema: ./schema
version:
  cloud: canary
logLevel:
  dev: info
  cloud: info
clientTypes:
  - format: typescript
    output: ./apps/web/src/schema.gen.ts
apps:
  web:
    type: frontend
    dev:
      type: npm
      script: dev
      workdir: ./apps/web
    deploy:
      # Required by config validation, unused on the free plan: the SPA is
      # built with `static.build` and published as static assets.
      dockerfile: ./apps/web/Dockerfile
      context: .
      port: 80
      static:
        build: pnpm --filter @studycall/web build
        dir: apps/web/dist
  # The API (apps/api) is not listed here: the free plan runs no backends, so
  # it is our own Cloudflare Worker, deployed with `pnpm deploy:api`. Local
  # development (dev/sp00ky.yml) starts it under `wrangler dev`.
